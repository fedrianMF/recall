<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall · Bocetos de marca</title>
<style>
  body { margin: 0; padding: 32px; background: #dce5d9; font-family: system-ui, sans-serif; color: #151915; }
  h1 { margin: 0 0 24px; font-size: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .card { background: #fff; border-radius: 16px; padding: 20px; }
  .card h2 { margin: 0 0 16px; font-size: 15px; }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .row img { display: block; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; }
  .dark { background: #0b0c0b; color: #fff; }
  .light { background: #eef3ed; color: #151915; }
  .word { font-weight: 900; font-style: italic; letter-spacing: 0.08em; font-size: 22px; }
</style>
</head>
<body>
<h1>Recall · Bocetos de marca (borrador, no usados en la app)</h1>
<div class="grid">
  <!-- one card per sketch -->
  <div class="card"><h2>A · Monograma angular</h2>
    <div class="row"><img src="boceto-a-monograma.svg" width="128" height="128" alt=""><img src="boceto-a-monograma.svg" width="48" height="48" alt=""><img src="boceto-a-monograma.svg" width="32" height="32" alt=""><img src="boceto-a-monograma.svg" width="16" height="16" alt=""></div>
    <div class="bar dark"><img src="boceto-a-monograma.svg" width="28" height="28" alt=""><span class="word">RECALL</span></div></div>
  <div class="card"><h2>B · Rebobinado</h2>
    <div class="row"><img src="boceto-b-rebobinado.svg" width="128" height="128" alt=""><img src="boceto-b-rebobinado.svg" width="48" height="48" alt=""><img src="boceto-b-rebobinado.svg" width="32" height="32" alt=""><img src="boceto-b-rebobinado.svg" width="16" height="16" alt=""></div>
    <div class="bar dark"><img src="boceto-b-rebobinado.svg" width="28" height="28" alt=""><span class="word">RECALL</span></div></div>
  <div class="card"><h2>C · Escudo hexagonal</h2>
    <div class="row"><img src="boceto-c-escudo.svg" width="128" height="128" alt=""><img src="boceto-c-escudo.svg" width="48" height="48" alt=""><img src="boceto-c-escudo.svg" width="32" height="32" alt=""><img src="boceto-c-escudo.svg" width="16" height="16" alt=""></div>
    <div class="bar dark"><img src="boceto-c-escudo.svg" width="28" height="28" alt=""><span class="word">RECALL</span></div></div>
  <div class="card"><h2>D · Replay + rayo</h2>
    <div class="row"><img src="boceto-d-replay.svg" width="128" height="128" alt=""><img src="boceto-d-replay.svg" width="48" height="48" alt=""><img src="boceto-d-replay.svg" width="32" height="32" alt=""><img src="boceto-d-replay.svg" width="16" height="16" alt=""></div>
    <div class="bar dark"><img src="boceto-d-replay.svg" width="28" height="28" alt=""><span class="word">RECALL</span></div></div>
</div>
</body>
</html>
